# Eval CI gate: fail the pipeline when offline fixtures regress.
name: eval-gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Run eval gate
        run: make eval-gate
