# Minimal production-oriented Deployment + Service for the inference gateway.
# Apply: kubectl apply -f deploy/k8s/inference-gateway.yaml
# Set image and secrets before production use (see deploy/README.md production hardening).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-gateway
  labels:
    app.kubernetes.io/name: inference-gateway
    app.kubernetes.io/part-of: atlas
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: inference-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference-gateway
        app.kubernetes.io/part-of: atlas
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: inference-gateway
          image: atlas/inference-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ATLAS_INFERENCE_ADDR
              value: ":8080"
            - name: ATLAS_INFERENCE_PROVIDER
              value: "fake"
            - name: ATLAS_INFERENCE_MODEL
              value: "fake-model"
            # Production: set from Secret, e.g. ATLAS_DATABASE_URL, provider API keys
            - name: ATLAS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: atlas-gateway-secrets
                  key: database-url
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: inference-gateway
  labels:
    app.kubernetes.io/name: inference-gateway
    app.kubernetes.io/part-of: atlas
spec:
  selector:
    app.kubernetes.io/name: inference-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
