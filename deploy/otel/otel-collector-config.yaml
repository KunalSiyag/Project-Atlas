# Atlas local OpenTelemetry Collector
# Receives OTLP from inference-gateway (ATLAS_OTEL_EXPORTER=otlp) and exposes
# Prometheus metrics scraped by Grafana.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
    send_batch_size: 256
  memory_limiter:
    check_interval: 2s
    limit_mib: 256

exporters:
  # Debug to collector logs for local inspection
  debug:
    verbosity: basic
  # Prometheus exporter for Grafana datasource
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: atlas
    const_labels:
      service_namespace: atlas
  # Also keep OTLP for optional Jaeger/Tempo later
  otlp/noop:
    endpoint: localhost:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
  telemetry:
    logs:
      level: info
