openapi: 3.0.3
info:
  title: Atlas Agent Orchestrator
  description: |
    HTTP control surface for the agent orchestrator service.
    This document describes endpoints implemented in Go today (handler.go).
    Runs (create/start/get/approve/reject/cancel/events), knowledge ingest, memory,
    health probes, and OpenAPI document serve.
  version: 0.2.0
servers:
  - url: http://localhost:8090
    description: Local development default (ATLAS_ORCHESTRATOR_ADDR)
paths:
  /openapi.yaml:
    get:
      operationId: getOpenAPI
      summary: Download embedded OpenAPI 3 YAML (also /openapi.yml, /v1/openapi.yaml)
      responses:
        "200":
          description: OpenAPI document
          content:
            application/yaml:
              schema:
                type: string
  /healthz:
    get:
      operationId: healthz
      summary: Liveness probe
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOk"
  /readyz:
    get:
      operationId: readyz
      summary: Readiness probe (service wired)
      responses:
        "200":
          description: Ready to accept control requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusReady"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/runs:
    post:
      operationId: createRun
      summary: Create a pending run (plan from goal)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRunRequest"
      responses:
        "201":
          description: Run created in pending status with planned steps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          description: Invalid goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Service not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/runs/{run_id}:
    get:
      operationId: getRun
      summary: Inspect a run snapshot
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Current run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          description: Missing or malformed run id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/runs/{run_id}/events:
    get:
      operationId: listRunEvents
      summary: List lifecycle events for a run (from RunStore.ListEvents)
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Ordered event list (may be empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        "400":
          description: Missing or malformed run id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Run not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/runs/{run_id}/start:
    post:
      operationId: startRun
      summary: Execute or resume a run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Updated run (terminal or waiting_approval)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "409":
          description: Conflict (not startable or executor error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/runs/{run_id}/approve:
    post:
      operationId: approveRun
      summary: Approve waiting tool step(s) and continue execution
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run after approval resume
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "409":
          description: No step waiting for approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/runs/{run_id}/reject:
    post:
      operationId: rejectRun
      summary: Reject approval and fail the run
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRequest"
      responses:
        "200":
          description: Failed run after reject
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "409":
          description: Reject failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      summary: Request cancellation of a non-terminal run
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: Run with cancel_requested (or already terminal)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "409":
          description: Cancel failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/knowledge/ingest:
    post:
      operationId: ingestKnowledge
      summary: Ingest a document into the RAG retriever
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Document"
      responses:
        "201":
          description: Ingested document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Document"
        "400":
          description: Invalid body or ingest error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Service not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /v1/memory:
    post:
      operationId: putMemory
      summary: Store a long-term memory fact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryFact"
      responses:
        "201":
          description: Stored fact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryFact"
        "400":
          description: Invalid body or memory error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "503":
          description: Service not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
components:
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
  schemas:
    StatusOk:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ok
        service:
          type: string
          example: agent-orchestrator
    StatusReady:
      type: object
      required: [status, service]
      properties:
        status:
          type: string
          example: ready
        service:
          type: string
          example: agent-orchestrator
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: string
        status:
          type: string
    CreateRunRequest:
      type: object
      properties:
        goal:
          type: string
          description: User goal used by the planner
    RejectRequest:
      type: object
      properties:
        reason:
          type: string
    Run:
      type: object
      required: [run_id, goal, status, steps, created_at, updated_at]
      properties:
        run_id:
          type: string
        goal:
          type: string
        status:
          type: string
          enum:
            - pending
            - running
            - succeeded
            - failed
            - cancelled
            - waiting_approval
        steps:
          type: array
          items:
            $ref: "#/components/schemas/Step"
        result:
          type: string
        error:
          type: string
        cancel_requested:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Step:
      type: object
      required: [step_id, name, kind, status]
      properties:
        step_id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [context, model, tool, finalize]
        depends_on:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - pending
            - running
            - succeeded
            - failed
            - skipped
            - cancelled
            - waiting_approval
        attempts:
          type: integer
        max_attempts:
          type: integer
        output:
          type: string
        error:
          type: string
        prompt:
          type: string
        tool_name:
          type: string
        tool_input:
          type: object
          additionalProperties: true
        requires_approval:
          type: boolean
        approved:
          type: boolean
    Document:
      type: object
      required: [content]
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        source:
          type: string
        vector:
          type: array
          items:
            type: number
        score:
          type: number
        chunk_index:
          type: integer
        parent_id:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
    MemoryFact:
      type: object
      required: [content]
      properties:
        id:
          type: string
        workspace_id:
          type: string
        user_id:
          type: string
        scope:
          type: string
          description: short | long (HTTP put is long-term)
        key:
          type: string
        content:
          type: string
        run_id:
          type: string
        created_at:
          type: string
          format: date-time
    Event:
      type: object
      required: [event_id, run_id, type, message, created_at]
      properties:
        event_id:
          type: string
        run_id:
          type: string
        step_id:
          type: string
        type:
          type: string
          description: Lifecycle type (run_created, step_started, …)
        message:
          type: string
        created_at:
          type: string
          format: date-time
